<!
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tabela de Ninjas</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&family=Noto+Sans+JP:wght@500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans JP', 'Kanit', sans-serif;
            background: linear-gradient(135deg, #082C8C 0%, #1a1a2e 50%, #0f0f1e 100%);
            color: #F0EBDF;
            padding: 2rem;
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            font-size: 3rem;
            font-weight: 700;
            color: #FDD501;
            text-shadow:
                    3px 3px 0 #F66C2D,
                    6px 6px 0 #000,
                    -2px -2px 0 #000;
            margin-bottom: 2rem;
            letter-spacing: 2px;
            font-family: 'Kanit', sans-serif;
        }

        table {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            border-collapse: separate;
            border-spacing: 0;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            overflow: hidden;
            box-shadow:
                    0 8px 32px rgba(0, 0, 0, 0.4),
                    0 0 0 3px #F66C2D,
                    0 0 20px rgba(246, 108, 45, 0.3);
        }

        thead {
            background: linear-gradient(135deg, #F66C2D 0%, #E14011 100%);
        }

        thead th {
            padding: 1.2rem;
            text-align: left;
            font-weight: 700;
            font-size: 1.1rem;
            color: #FDD501;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 3px solid #000;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        tbody tr {
            transition: all 0.3s ease;
            background: rgba(8, 44, 140, 0.2);
            border-bottom: 2px solid rgba(246, 108, 45, 0.2);
        }

        tbody tr:nth-child(even) {
            background: rgba(54, 54, 65, 0.3);
        }

        tbody tr:hover {
            background: linear-gradient(90deg, rgba(246, 108, 45, 0.3), rgba(70, 145, 204, 0.3));
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(246, 108, 45, 0.4);
        }

        td {
            padding: 1rem;
            font-size: 1rem;
            color: #F0EBDF;
            vertical-align: middle;
            border-right: 1px solid rgba(246, 108, 45, 0.1);
        }

        td:last-child {
            border-right: none;
        }

        td img {
            border-radius: 50%;
            border: 4px solid #FDD501;
            box-shadow:
                    0 0 15px rgba(253, 213, 1, 0.5),
                    0 4px 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        td img:hover {
            transform: rotate(360deg) scale(1.1);
            border-color: #F66C2D;
        }

        a {
            display: inline-block;
            padding: 0.5rem 1rem;
            text-decoration: none;
            font-weight: 700;
            border-radius: 8px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        td:nth-last-child(2) a {
            background: linear-gradient(135deg, #E60000 0%, #8B0000 100%);
            color: #FFF;
            border: 2px solid #000;
            box-shadow: 0 4px 8px rgba(230, 0, 0, 0.4);
        }

        td:nth-last-child(2) a:hover {
            background: linear-gradient(135deg, #FF0000 0%, #B22222 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(230, 0, 0, 0.6);
        }

        td:last-child a {
            background: linear-gradient(135deg, #4691CC 0%, #082C8C 100%);
            color: #FDD501;
            border: 2px solid #000;
            box-shadow: 0 4px 8px rgba(70, 145, 204, 0.4);
        }

        td:last-child a:hover {
            background: linear-gradient(135deg, #5AA5E0 0%, #0A3AAF 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(70, 145, 204, 0.6);
        }

        ::-webkit-scrollbar {
            width: 12px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #F66C2D, #E14011);
            border-radius: 6px;
            border: 2px solid #000;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #FDD501, #F66C2D);
        }
    </style>

</head>
<body>
<h1>Lista de Ninjas</h1>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Imagem</th>
            <th>Nome</th>
            <th>Idade</th>
            <th>email</th>
            <th>Rank</th>
            <th>Missões</th>
        </tr>
    </thead>

    <thead>
    <tbody>
    <tr th:each ="ninja: ${ninjas}">
        <td th:text="${ninja.id}"> </td>
        <td><img th:src="${ninja.imgUrl}" width="200" height="200"> </td>
        <td th:text="${ninja.nome}"> </td>
        <td th:text="${ninja.idade}"> </td>
        <td th:text="${ninja.email}"> </td>
        <td th:text="${ninja.rank}"> </td>
        <td th:text="${ninja.missoes.nome}"> </td>
        <td ><a th:href="@{/ninjas/ui/#/{id}(id=${ninja.id})}">Alterar</a></td>
        <td ><a th:href="@{/ninjas/ui/#/{id}(id=${ninja.id})}">Ver detalhes</a></td>
        <td><a th:href="@{/ninjas/ui/delete/{id}(id=${ninja.id})}">Deletar</a></td>


    </tr>
</tbody>
    </thead>
</table>

</body>
</html>
